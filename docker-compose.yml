services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calendar}
      POSTGRES_DB: ${POSTGRES_DB:-calendar}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-calendar} -d ${POSTGRES_DB:-calendar}"]
      interval: 5s
      timeout: 3s
      retries: 10

  calendar:
    build: .
    image: tma-calendar:local
    container_name: tma-calendar
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-calendar}:${POSTGRES_PASSWORD:-calendar}@db:5432/${POSTGRES_DB:-calendar}
      PORT: 8000
      STATIC_DIR: /app/static
      UPLOAD_DIR: /data/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      - calendar-data:/data

volumes:
  postgres-data:
  calendar-data:
